name: a-lanes (staging only)
on:
  workflow_dispatch:
  push:
    branches: [a0322-lanes]
permissions:
  contents: read
jobs:
  relay:
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.20"
          python-version: "3.12"
          enable-cache: false
      - name: install what the relay needs, each by its hash
        run: |
          uv venv --no-config --python 3.12 "$RUNNER_TEMP/knos"
          uv pip install --no-config --python "$RUNNER_TEMP/knos/bin/python" --require-hashes --no-deps --no-build -r requirements/sign.txt
      - name: this runner carries its part of one owner's tokens
        env:
          KNOS_RELAY_PARTITION: ${{ matrix.part }}/4
        run: |
          mkdir -p parts
          "$RUNNER_TEMP/knos/bin/python" .github/a-lanes/a_lanes.py run --out "parts/part-${{ matrix.part }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: part-${{ matrix.part }}
          path: parts/part-${{ matrix.part }}.json
  judge:
    needs: relay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: parts
          merge-multiple: true
      - name: one owner's orders over the runners
        run: python3 .github/a-lanes/a_lanes.py judge parts/part-*.json
